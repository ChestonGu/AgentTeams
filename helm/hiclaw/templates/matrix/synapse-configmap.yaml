{{- if and (eq .Values.matrix.provider "synapse") (eq .Values.matrix.mode "managed") }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hiclaw.synapse.fullname" . }}
  namespace: {{ include "hiclaw.namespace" . }}
  labels:
    {{- include "hiclaw.component.labels" (dict "root" . "component" "synapse") | nindent 4 }}
data:
  homeserver.yaml: |
    server_name: {{ include "hiclaw.synapse.serverName" . | quote }}
    report_stats: false
    signing_key_path: /data/signing.key
    macaroon_secret_key: {{ .Values.matrix.synapse.macaroonSecret | default "change-me-macaroon" | quote }}
    form_secret: {{ .Values.matrix.synapse.formSecret | default "change-me-form" | quote }}
    registration_shared_secret: {{ .Values.matrix.synapse.registrationSharedSecret | default "change-me-reg-shared-secret" | quote }}

    listeners:
      - port: {{ .Values.matrix.synapse.service.port }}
        tls: false
        type: http
        x_forwarded: true
        resources:
          - names: [client, federation]

    database:
      name: psycopg2
      args:
        user: synapse
        password: {{ .Values.matrix.synapse.postgres.password | default "synapse-change-me" | quote }}
        database: synapse
        host: {{ include "hiclaw.synapse.postgres.fullname" . }}.{{ include "hiclaw.namespace" . }}.svc.cluster.local
        port: 5432
        cp_min: 5
        cp_max: 10

    media_store_path: /data/media
    enable_registration: false
    trusted_key_servers:
      - server_name: matrix.org
    bcrypt_rounds: 12
    max_upload_size: 50M
    federation_domain_whitelist: []
{{- end }}
