{{- if and (eq .Values.matrix.provider "synapse") (eq .Values.matrix.mode "managed") }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hiclaw.synapse.postgres.fullname" . }}
  namespace: {{ include "hiclaw.namespace" . }}
  labels:
    {{- include "hiclaw.component.labels" (dict "root" . "component" "synapse-postgres") | nindent 4 }}
spec:
  selector:
    {{- include "hiclaw.component.selectorLabels" (dict "root" . "component" "synapse-postgres") | nindent 4 }}
  ports:
    - { name: pg, port: 5432, targetPort: 5432 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "hiclaw.synapse.postgres.fullname" . }}
  namespace: {{ include "hiclaw.namespace" . }}
  labels:
    {{- include "hiclaw.component.labels" (dict "root" . "component" "synapse-postgres") | nindent 4 }}
spec:
  serviceName: {{ include "hiclaw.synapse.postgres.fullname" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "hiclaw.component.selectorLabels" (dict "root" . "component" "synapse-postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hiclaw.component.selectorLabels" (dict "root" . "component" "synapse-postgres") | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.matrix.synapse.postgres.image.repository }}:{{ .Values.matrix.synapse.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.matrix.synapse.postgres.image.pullPolicy }}
          env:
            - { name: POSTGRES_DB,       value: "synapse" }
            - { name: POSTGRES_USER,     value: "synapse" }
            - name: POSTGRES_PASSWORD
              value: {{ .Values.matrix.synapse.postgres.password | default "synapse-change-me" | quote }}
          ports:
            - { name: pg, containerPort: 5432 }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data, subPath: pgdata }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "synapse"] }
            initialDelaySeconds: 5
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: {{ .Values.matrix.synapse.postgres.persistence.size | default "10Gi" }} } }
        {{- with .Values.matrix.synapse.postgres.persistence.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
{{- end }}
