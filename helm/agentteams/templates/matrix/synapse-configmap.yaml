{{- if and (eq .Values.matrix.provider "synapse") (eq .Values.matrix.mode "managed") }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agentteams.synapse.fullname" . }}
  namespace: {{ include "agentteams.namespace" . }}
  labels:
    {{- include "agentteams.component.labels" (dict "root" . "component" "synapse") | nindent 4 }}
data:
  homeserver.yaml: |
    server_name: {{ include "agentteams.synapse.serverName" . | quote }}
    report_stats: false
    signing_key_path: /data/signing.key
    macaroon_secret_key: {{ .Values.matrix.synapse.macaroonSecret | default "change-me-macaroon" | quote }}
    form_secret: {{ .Values.matrix.synapse.formSecret | default "change-me-form" | quote }}
    registration_shared_secret: {{ .Values.matrix.synapse.registrationSharedSecret | default "change-me-reg-shared-secret" | quote }}

    listeners:
      - port: {{ .Values.matrix.synapse.service.port }}
        tls: false
        type: http
        x_forwarded: true
        resources:
          - names: [client, federation]

    database:
      name: psycopg2
      args:
        user: synapse
        password: {{ .Values.matrix.synapse.postgres.password | default "synapse-change-me" | quote }}
        database: synapse
        host: {{ include "agentteams.synapse.postgres.fullname" . }}.{{ include "agentteams.namespace" . }}.svc.cluster.local
        port: 5432
        cp_min: 5
        cp_max: 10
      allow_unsafe_locale: true   # Synapse 级选项(与 args 同级,非 psycopg2 连接参数);postgres 默认 locale 非 C

    media_store_path: /data/media
    # 见 values.matrix.synapse.enableAuthenticatedMedia:Synapse 默认开启 MSC4016
    # authenticated media,但 /_matrix/media/v3/download 无 token 下载会被 404
    # (raise NotFoundError),即使文件与 DB 记录完好。私有集群默认关闭。
    enable_authenticated_media: {{ .Values.matrix.synapse.enableAuthenticatedMedia | default false }}
    enable_registration: true
    enable_registration_without_verification: true   # 私有集群:controller 是唯一注册方;否则 Synapse 拒启动("开注册无验证")
    trusted_key_servers:
      - server_name: matrix.org
    bcrypt_rounds: 12
    max_upload_size: 50M
    federation_domain_whitelist: []
    {{- /* Load the AgentTeams AppService registration rendered by synapse-appservice-secret.yaml
         when AppService mode is enabled. Synapse reads this file at startup; the StatefulSet
         mounts the Secret at /as-registrations (readOnly). */ -}}
    {{- if .Values.matrix.appservice.enabled }}
    app_service_config_files:
      - /as-registrations/agentteams-controller.yaml
    {{- end }}
    # Raise rate limits — agentteams controller provisions multiple users in bursts
    # (admin login + per-user create/login), which trips Synapse's low defaults
    # (rc_login burst 3) into M_LIMIT_EXCEEDED storms.
    rc_login:
      address: {per_second: 50, burst_count: 200}
      account: {per_second: 50, burst_count: 200}
      failed_attempts: {per_second: 50, burst_count: 200}
    rc_admin:
      per_second: 50
      burst_count: 200
    rc_message:
      per_second: 50
      burst_count: 200
{{- end }}
