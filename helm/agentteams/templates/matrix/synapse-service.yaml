{{- if and (eq .Values.matrix.provider "synapse") (eq .Values.matrix.mode "managed") }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentteams.synapse.fullname" . }}
  namespace: {{ include "agentteams.namespace" . }}
  labels:
    {{- include "agentteams.component.labels" (dict "root" . "component" "synapse") | nindent 4 }}
spec:
  type: {{ .Values.matrix.synapse.service.type }}
  selector:
    {{- include "agentteams.component.selectorLabels" (dict "root" . "component" "synapse") | nindent 4 }}
  ports:
    - { name: http, port: {{ .Values.matrix.synapse.service.port }}, targetPort: http }
{{- end }}
