{{- /*
Synapse AppService registration Secret.

Rendered only for matrix.provider=synapse + matrix.mode=managed + matrix.appservice.enabled.
00-validate.yaml guarantees matrix.appservice.asToken/hsToken are non-empty in this combination
(Helm cannot sync auto-generated tokens across two Secrets on first install, so explicit
tokens are required for Synapse; tuwunel registers at runtime and auto-generation is fine).

The Secret is mounted read-only at /as-registrations/agentteams-controller.yaml by the
Synapse StatefulSet, and homeserver.yaml references it via app_service_config_files. The
controller reads the same tokens from the runtime-env Secret (AGENTTEAMS_MATRIX_APPSERVICE_AS_TOKEN /
_HS_TOKEN), so the values here MUST match runtime-env — both consume .Values.matrix.appservice
directly, so explicit values guarantee consistency.
*/ -}}
{{- if and (eq .Values.matrix.provider "synapse") (eq .Values.matrix.mode "managed") .Values.matrix.appservice.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agentteams.synapse.fullname" . }}-appservice
  namespace: {{ include "agentteams.namespace" . }}
  labels:
    {{- include "agentteams.component.labels" (dict "root" . "component" "synapse") | nindent 4 }}
type: Opaque
stringData:
  agentteams-controller.yaml: |
    id: {{ .Values.matrix.appservice.id | quote }}
    {{- $pushURL := include "agentteams.appservice.pushURL" . | trim }}
    {{- if $pushURL }}
    url: {{ $pushURL | quote }}
    {{- else }}
    # url omitted — passwordless-only mode (no homeserver→AS transaction push)
    {{- end }}
    as_token: {{ required "matrix.appservice.asToken is required for provider=synapse (Helm cannot sync auto-generated tokens across Secrets on first install)" .Values.matrix.appservice.asToken | quote }}
    hs_token: {{ required "matrix.appservice.hsToken is required for provider=synapse" .Values.matrix.appservice.hsToken | quote }}
    sender_localpart: {{ .Values.matrix.appservice.senderLocalpart | quote }}
    rate_limited: false
    namespaces:
      users:
        # NOT exclusive. An exclusive users namespace blocks ALL other user
        # creation for matching IDs — including the shared-secret admin
        # bootstrap (register_new_matrix_user -a) and the admin API
        # PUT /_synapse/admin/v2/users/{id} — with HTTP 400 M_EXCLUSIVE
        # "This user ID is reserved by an application service."
        # (RegistrationHandler.check_user_id_not_appservice_exclusive, no admin
        # bypass, verified against Synapse v1.127.0). With the default broad
        # regex @.*:<server> that would make the admin user and every
        # admin-provisioned user uncreatable. AS register/login do NOT require
        # exclusivity (ApplicationService.is_interested_in_user only checks the
        # regex), so a non-exclusive namespace keeps passwordless provisioning
        # working while letting the controller create users via the admin API.
        - exclusive: false
          regex: {{ .Values.matrix.appservice.userNamespaceRegex | default (printf "@.*:%s" (include "agentteams.synapse.serverName" .)) | quote }}
      aliases:
        - exclusive: false
          regex: {{ printf "#agentteams-.*:%s" (include "agentteams.synapse.serverName" .) | quote }}
      rooms: []
{{- end }}
