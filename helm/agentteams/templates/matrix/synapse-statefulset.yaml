{{- if and (eq .Values.matrix.provider "synapse") (eq .Values.matrix.mode "managed") }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "agentteams.synapse.fullname" . }}
  namespace: {{ include "agentteams.namespace" . }}
  labels:
    {{- include "agentteams.component.labels" (dict "root" . "component" "synapse") | nindent 4 }}
spec:
  serviceName: {{ include "agentteams.synapse.fullname" . }}
  replicas: {{ .Values.matrix.synapse.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "agentteams.component.selectorLabels" (dict "root" . "component" "synapse") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agentteams.component.selectorLabels" (dict "root" . "component" "synapse") | nindent 8 }}
    spec:
      initContainers:
        # Generate the signing key (and any missing secrets) into the data
        # volume on first boot. Idempotent: a no-op when the key already exists.
        - name: generate-keys
          image: "{{ .Values.matrix.synapse.image.repository }}:{{ .Values.matrix.synapse.image.tag }}"
          imagePullPolicy: {{ .Values.matrix.synapse.image.pullPolicy }}
          command: ["python", "-m", "synapse.app.homeserver"]
          args: ["--config-path", "/config/homeserver.yaml", "--generate-keys"]
          volumeMounts:
            - { name: config, mountPath: /config, readOnly: true }
            - { name: data,  mountPath: /data }
      containers:
        - name: synapse
          image: "{{ .Values.matrix.synapse.image.repository }}:{{ .Values.matrix.synapse.image.tag }}"
          imagePullPolicy: {{ .Values.matrix.synapse.image.pullPolicy }}
          command: ["python", "-m", "synapse.app.homeserver"]
          args: ["--config-path", "/config/homeserver.yaml"]
          ports:
            - { name: http, containerPort: {{ .Values.matrix.synapse.service.port }} }
          env:
            - { name: SYNAPSE_SERVER_NAME, value: {{ include "agentteams.synapse.serverName" . | quote }} }
            - { name: SYNAPSE_REPORT_STATS, value: "no" }
          volumeMounts:
            - { name: config, mountPath: /config, readOnly: true }
            - { name: data,  mountPath: /data }
            {{- /* AppService registration YAML (declarative). Mounted from the
                 synapse-appservice Secret so Synapse loads the controller's AS
                 registration at startup via app_service_config_files. */ -}}
            {{- if .Values.matrix.appservice.enabled }}
            - { name: appservice, mountPath: /as-registrations, readOnly: true }
            {{- end }}
          readinessProbe:
            httpGet: { path: /_matrix/client/versions, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /_matrix/client/versions, port: http }
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            {{- toYaml .Values.matrix.synapse.resources | nindent 12 }}
      volumes:
        - name: config
          configMap: { name: {{ include "agentteams.synapse.fullname" . }} }
        {{- if .Values.matrix.appservice.enabled }}
        - name: appservice
          secret:
            secretName: {{ include "agentteams.synapse.fullname" . }}-appservice
            defaultMode: 0440   # readable by Synapse, not world-readable
        {{- end }}
  {{- if .Values.matrix.synapse.persistence.enabled }}
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: {{ .Values.matrix.synapse.persistence.size }} } }
        {{- with .Values.matrix.synapse.persistence.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
  {{- end }}
{{- end }}
