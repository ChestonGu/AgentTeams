{{- if and (eq .Values.storage.provider "oss") .Values.storage.oss.accessKey .Values.storage.oss.secretKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agentteams.storage.ossCredsSecretName" . }}
  namespace: {{ include "agentteams.namespace" . }}
  labels:
    {{- include "agentteams.component.labels" (dict "root" . "component" "storage") | nindent 4 }}
type: Opaque
stringData:
  accessKey: {{ .Values.storage.oss.accessKey | quote }}
  secretKey: {{ .Values.storage.oss.secretKey | quote }}
{{- end }}
