# worker-bridge-operator: per-worker cimicode runtime pod automation.
# See worker_bridge_operator.py for the dispatch model: spec.adapterMode
# cimicode-stateless → zero provisioning (binding via runtime.yaml bridge
# section); cimicode-pod/empty → single cimicode Deployment + Service plus
# the Worker CR spec.env wiring (BRIDGE_RUNTIME_* for the bridge self-heal).
# Namespace names below are placeholders — set per environment at apply time.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker-bridge-operator
  namespace: REPLACE_NS
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: worker-bridge-operator
  namespace: REPLACE_NS
rules:
  - apiGroups: ["agentteams.io"]
    resources: ["workers"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: worker-bridge-operator
  namespace: REPLACE_NS
subjects:
  - kind: ServiceAccount
    name: worker-bridge-operator
    namespace: REPLACE_NS
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: worker-bridge-operator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-bridge-operator
  namespace: REPLACE_NS
  labels:
    app: worker-bridge-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker-bridge-operator
  template:
    metadata:
      labels:
        app: worker-bridge-operator
    spec:
      serviceAccountName: worker-bridge-operator
      containers:
        - name: operator
          image: REPLACE_IMAGE  # e.g. <registry>/worker-bridge-operator:<tag>
          imagePullPolicy: IfNotPresent
          env:
            - name: WATCH_NAMESPACE
              value: REPLACE_NS
            # Required, no default: internal cimicode runtime image.
            - name: CIMICODE_IMAGE
              value: REPLACE_CIMICODE_IMAGE
            - name: CIMICODE_PORT
              value: "8080"
            # Opt-in readiness probe (cimicode HTTP surface not pinned by
            # the contract) — set to match the actual image, e.g. /healthz.
            - name: CIMICODE_PROBE_PATH
              value: ""
            - name: RECONCILE_INTERVAL
              value: "10"
