matrix:
  homeserver_url: "${AGENTTEAMS_MATRIX_URL}"
  token_env: AGENTTEAMS_WORKER_MATRIX_TOKEN
  sync_timeout_seconds: 30
runtime:
  # adapter / base_url 留空：由 BRIDGE_RUNTIME_* env（部署层/存量 operator）
  # 或 runtime.yaml 顶层 bridge 段（controller 投影）裁决；pod 模式还可从
  # svc 命名契约推导（<w>-cimicode-svc:4096，过健康门禁后接线）。皆缺时
  # bridge 保持未定态等待自愈——绝不在此写死回退地址。
  auth_type: none
filter:
  require_mention: true
  allow_unknown: false
history:
  max_entries: 50
store:
  # s3：since 游标持久化到 MinIO agents/<w>/state/，pod 重启增量续传不重放；
  # 无 AGENTTEAMS_FS_* env（本地开发）自动降级 memory。
  backend: s3

emitter:
  # thinking/tools = "thread"：思考链与工具调用透出到该 turn 消息的
  # Matrix thread（Element UI 折叠区），不再静默丢弃；"hide"/"compact"
  # 保持旧行为。两者独立开关。
  thinking: "hide"
  tools: "compact"