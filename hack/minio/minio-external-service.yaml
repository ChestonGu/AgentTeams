apiVersion: v1
kind: Service
metadata:
  name: agentteams-minio-external
  namespace: agentos
  labels:
    app.kubernetes.io/name: agentteams-minio-external
    app.kubernetes.io/component: minio-access
spec:
  type: NodePort
  selector:
    app.kubernetes.io/component: minio
    app.kubernetes.io/instance: agentteams-128
    app.kubernetes.io/name: agentteams
  ports:
    - name: api
      port: 9000
      targetPort: api
      protocol: TCP
      nodePort: 32000
    - name: console
      port: 9001
      targetPort: console
      protocol: TCP
      nodePort: 32001
