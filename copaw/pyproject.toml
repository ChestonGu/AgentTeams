[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "copaw-worker"
version = "1.0.3"
description = "Lightweight AgentTeams Worker runtime based on CoPaw"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "copaw==1.0.2",
    "matrix-nio[e2e]>=0.24.0",
    "markdown-it-py>=3.0",
    "linkify-it-py>=2.0",
    "pyyaml>=6.0",
    # These three pins reproduce the dependency resolve of the image that ran
    # the 105 five-team verification; an unpinned resolve drifts to newer
    # releases that break at runtime (both pins apply to both venvs):
    # - mcp 2.0 renamed `streamablehttp_client` -> `streamable_http_client`,
    #   and agentscope/reme/agentscope_runtime still import the old symbol:
    #   ImportError on any in-process MCP client init.
    # - openai >= 3.29 defines `delta.audio` on every streamed chunk (default
    #   None); agentscope 1.0.18 guards audio handling with hasattr(), so the
    #   ever-present None field turns `"data" in choice.delta.audio` into a
    #   TypeError on every turn.
    "mcp==1.29.1",
    "agentscope==1.0.18",
    "openai==3.3.1",
]

[project.urls]
Homepage = "https://github.com/agentscope-ai/AgentTeams"
Repository = "https://github.com/agentscope-ai/AgentTeams"

[project.scripts]
copaw-worker = "copaw_worker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
copaw_worker = ["templates/*.json"]
