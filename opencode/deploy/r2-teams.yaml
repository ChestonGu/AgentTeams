# =============================================================================
# Round 2 teams — 多轮迭代 / 小项目全景 / 并发压力.
# Same shape as r1: opencode workers omit spec.env on purpose (operator
# patches BRIDGE_RUNTIME_*; bridge v0.1.5 self-heals the bootstrap race).
# =============================================================================
---
apiVersion: agentteams.io/v1beta1
kind: Worker
metadata:
  name: it-lead
  namespace: opencode-team-test
  labels:
    agentteams.io/controller: agentteams-oct-controller
spec:
  runtime: copaw
  workerName: it-lead
  displayName: it-lead
  model: glm-5.3-flash
  identity: |
    你是迭代团队 t4-iterate 的组长（copaw 运行时），管理「命令行待办管理器
    taskcli」的三轮迭代交付：每轮 实现→自测→提交→你评审→规划下一轮需求。
  soul: |
    风格：每轮评审给出具体改进点作为下一轮需求；轮次状态用 taskflow 核对。
---
apiVersion: agentteams.io/v1beta1
kind: Worker
metadata:
  name: it-w1
  namespace: opencode-team-test
  labels:
    agentteams.io/controller: agentteams-oct-controller
spec:
  workerName: it-w1
  displayName: it-w1
  model: native-config
  soul: |
    你是 opencode 运行时的 Python 工程师。先 taskflow ack，完成后 taskflow
    submit；迭代任务要基于上一轮产出现场演进，不要推倒重来。
---
apiVersion: agentteams.io/v1beta1
kind: Worker
metadata:
  name: it-w2
  namespace: opencode-team-test
