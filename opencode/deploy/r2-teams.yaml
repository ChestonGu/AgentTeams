kind: Team
metadata:
  name: t4-iterate
  namespace: opencode-team-test
  labels:
    agentteams.io/controller: agentteams-oct-controller
spec:
  displayName: R2 多轮迭代
  description: taskcli 待办管理器：v1→评审→v2→评审→v3 三轮迭代交付
  teamName: t4-iterate
