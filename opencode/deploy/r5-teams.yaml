# =============================================================================
# Round 5 regression — zero-intervention verification of the bootstrap
# convergence fixes (bridge v0.1.9 + controller v1.2.2.6 + runtime v0.1.3).
# No pod deletion, no nudge, no skill mention: create → dispatch → complete.
# r5-alpha: two parallel tasks; r5-beta: single fast task.
# =============================================================================
---
apiVersion: agentteams.io/v1beta1
kind: Worker
metadata:
  name: a5-lead
  namespace: opencode-team-test
  labels:
    agentteams.io/controller: agentteams-oct-controller
spec:
  runtime: copaw
  workerName: a5-lead
  displayName: a5-lead
  model: glm-5.3-flash
  identity: |
    你是回归团队 r5-alpha 的组长（copaw 运行时），负责「密码生成器 passgen」
    的交付：拆分任务并行分派给 a5-w1、a5-w2，验收并完结项目。
  soul: |
    风格：验收实际运行核对；报告简洁分点。
---
apiVersion: agentteams.io/v1beta1
kind: Worker
metadata:
  name: a5-w1
  namespace: opencode-team-test
  labels:
    agentteams.io/controller: agentteams-oct-controller
spec:
  workerName: a5-w1
  displayName: a5-w1
  model: native-config
  soul: |
    你是 opencode 运行时的 Python 工程师，交付高质量代码与测试。
---
apiVersion: agentteams.io/v1beta1
kind: Worker
metadata:
  name: a5-w2
  namespace: opencode-team-test
  labels:
    agentteams.io/controller: agentteams-oct-controller
spec:
  workerName: a5-w2
  displayName: a5-w2
  model: native-config
  soul: |
    你是 opencode 运行时的 Python 工程师，交付高质量代码与测试。
---
apiVersion: agentteams.io/v1beta1
kind: Worker
metadata:
  name: b5-lead
  namespace: opencode-team-test
  labels:
    agentteams.io/controller: agentteams-oct-controller
spec:
  runtime: copaw
  workerName: b5-lead
  displayName: b5-lead
  model: glm-5.3-flash
  identity: |
    你是回归团队 r5-beta 的组长（copaw 运行时），负责「文本摘要工具
    tldr」单任务交付：派发、验收、完结。
  soul: |
    风格：小项目快速闭环；验收核对测试输出。
---
apiVersion: agentteams.io/v1beta1
kind: Worker
metadata:
  name: b5-w1
  namespace: opencode-team-test
  labels:
    agentteams.io/controller: agentteams-oct-controller
spec:
  workerName: b5-w1
  displayName: b5-w1
  model: native-config
  soul: |
    你是 opencode 运行时的 Python 工程师，交付高质量代码与测试。
---
apiVersion: agentteams.io/v1beta1
kind: Team
metadata:
  name: r5-alpha
  namespace: opencode-team-test
  labels:
    agentteams.io/controller: agentteams-oct-controller
spec:
  displayName: R5 并行回归
  description: passgen 密码生成器：核心与 CLI 文档两任务并行
  teamName: r5-alpha
  workerMembers:
    - name: a5-lead
      role: team_leader
    - name: a5-w1
      role: worker
    - name: a5-w2
      role: worker
---
apiVersion: agentteams.io/v1beta1
kind: Team
metadata:
  name: r5-beta
  namespace: opencode-team-test
  labels:
    agentteams.io/controller: agentteams-oct-controller
spec:
  displayName: R5 快速回归
  description: tldr 文本摘要工具：单任务闭环
  teamName: r5-beta
  workerMembers:
    - name: b5-lead
      role: team_leader
    - name: b5-w1
      role: worker
