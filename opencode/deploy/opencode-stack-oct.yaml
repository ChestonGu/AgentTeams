# =============================================================================
# opencode stack for the opencode-team-test namespace (manually deployed —
# NOT controller-managed by design: only the bridge pod masquerading as the
# worker is owned by the controller).
#
#   opencode pod     : `opencode serve` (conversation loop + LLM via the
#                      baked Zhipu Coding-Plan provider in the image)
#   sandbox pod      : tool chain + skills + taskflow wrappers + helper HTTP
#                      server (:4097 /exec + /agents-md)
#   shared workspace : hostPath /data/oct-ocw — opencode's custom bash tool
#                      forwards commands to the sandbox /exec; AGENTS.md is
#                      written by the bridge via the helper and read by
#                      opencode from the same directory
#
# Both pods pin to the control-plane node (105) so the hostPath volume is
# shared. Apply: kubectl apply -f opencode-stack-oct.yaml
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: opencode-svc
  namespace: opencode-team-test
  labels:
    app: opencode-svc
spec:
  selector:
    app: opencode
  ports:
    - name: http
      port: 4096
      targetPort: 4096
---
apiVersion: v1
kind: Service
metadata:
  name: opencode-sandbox-svc
  namespace: opencode-team-test
  labels:
    app: opencode-sandbox-svc
spec:
  selector:
    app: opencode-sandbox
  ports:
    - name: helper
      port: 4097
      targetPort: 4097
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencode
  namespace: opencode-team-test
  labels:
    app: opencode
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opencode
  template:
    metadata:
      labels:
        app: opencode
    spec:
      # hostPath workspace must land on the same node as the sandbox pod
      nodeSelector:
        kubernetes.io/hostname: extvdiadmin-vmware-virtual-platform
      containers:
        - name: opencode
          image: agentteams/opencode-runtime:v0.1.1-oct
          imagePullPolicy: IfNotPresent
          env:
            - name: OPENCODE_PORT
              value: "4096"
            - name: AGENTTEAMS_FS_ROOT
              value: /workspace
            - name: SANDBOX_EXEC_URL
              value: http://opencode-sandbox-svc.opencode-team-test.svc.cluster.local:4097
          ports:
            - name: http
              containerPort: 4096
          volumeMounts:
            - name: workspace
              mountPath: /workspace
          readinessProbe:
            httpGet:
              path: /session
              port: 4096
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /session
              port: 4096
            initialDelaySeconds: 20
            periodSeconds: 30
      volumes:
        - name: workspace
          hostPath:
            path: /data/oct-ocw/workspace
            type: DirectoryOrCreate
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencode-sandbox
  namespace: opencode-team-test
  labels:
    app: opencode-sandbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opencode-sandbox
  template:
    metadata:
      labels:
        app: opencode-sandbox
    spec:
      nodeSelector:
        kubernetes.io/hostname: extvdiadmin-vmware-virtual-platform
      containers:
        - name: sandbox
          image: agentteams/opencode-sandbox:v0.1.0-oct
          imagePullPolicy: IfNotPresent
          env:
            - name: AGENTTEAMS_FS_ROOT
              value: /workspace
            - name: AGENTTEAMS_WORKER_NAME
              value: ocw-1
            # -- filesync env contract (opencode contract §4.1) ---------------
            # taskflow --sync mc (the default) resolves the team shared root
            # from these. The sandbox is NOT controller-managed, so unlike a
            # copaw worker pod it receives nothing automatically. Values are
            # the controller-provisioned MinIO user for THIS worker (ocw-1):
            # extract from the bridge pod and populate the Secret, e.g.
            #   kubectl exec agentteams-worker-ocw-1 -n opencode-team-test -- \
            #     printenv AGENTTEAMS_FS_ACCESS_KEY   # -> secret stringData
            # (endpoint/bucket/team are non-secret and inlined below). The
            # live test env carries these as literal pod env via
            # `kubectl set env`; this manifest shows the reproducible form.
            - name: AGENTTEAMS_FS_ENDPOINT
              value: http://agentteams-oct-minio.opencode-team-test.svc.cluster.local:9000
            - name: AGENTTEAMS_FS_BUCKET
              value: agentteams-storage
            # storage team name = Team CR name with the bucket prefix already
            # stripped; resolves remote teams/<team>/shared/ (sync.py semantics)
            - name: AGENTTEAMS_TEAM
              value: oct-team
            # taskflow --actor / ownership guard default
            - name: AGENTTEAMS_MATRIX_USER_ID
              value: "@ocw-1:agentteams-oct-synapse.opencode-team-test.svc.cluster.local"
            - name: AGENTTEAMS_FS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: opencode-sandbox-fs
                  key: accessKey
            - name: AGENTTEAMS_FS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: opencode-sandbox-fs
                  key: secretKey
          ports:
            - name: helper
              containerPort: 4097
          volumeMounts:
            - name: workspace
              mountPath: /workspace
          readinessProbe:
            httpGet:
              path: /healthz
              port: 4097
            initialDelaySeconds: 3
            periodSeconds: 10
      volumes:
        - name: workspace
          hostPath:
            path: /data/oct-ocw/workspace
            type: DirectoryOrCreate
