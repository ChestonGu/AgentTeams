[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cimicode-bridge"
version = "0.1.0"
description = "AgentTeams cimicode bridge implementation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27.0",
  "httpx-sse>=0.4.0",
  "matrix-nio>=0.25.0",
  "markdown-it-py>=3.0",
  "linkify-it-py>=2.0",
  "pydantic>=2.7.0",
  "PyYAML>=6.0",
  "minio>=7.2.0",
  "redis>=5.0.0",
  "fastapi>=0.111.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
